; PlatformIO Project Configuration File
;
; B1 Battle Droid — single firmware (master / slave) on ESP32.
; See CLAUDE.md for the full architecture.
;
; https://docs.platformio.org/page/projectconf.html

[env]
; Genuinely shared across every ESP32 role environment. platform/board/framework
; are NOT here (each ESP32 env states them explicitly below) so that env:native
; — which needs none of them — inherits nothing ESP32-specific from this section.
monitor_speed = 115200
extra_scripts = pre:tools/pio_build_id.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -D MESH_TTL=4
    -D GROUP_KEY=\"changeme\"
    ; Hardware pinout (shared by master and slaves).
    -D B1_PIN_LED_ONBOARD=2
    -D B1_PIN_SERVO_PAN=25
    -D B1_PIN_SERVO_TILT=26

; Platform pinned to the pioarduino fork (Arduino-ESP32 core 3.1.3 / ESP-IDF 5.3 —
; required for esp_now_recv_info_t used by mesh_comm.cpp). "platform = espressif32"
; alone is ambiguous: locally, PlatformIO would prefer this fork already installed by
; URL (its version number, 53.x, is higher than the official registry's), but CI, which
; doesn't know this fork, used to fall back to the official registry (a much newer
; version, without esp_now_recv_info_t) and fail to build. Always keep this identical
; across the three ESP32 environments below and locally (pio pkg update -p) to avoid
; a new divergence.
; The master/slave role is set in src/config.h (#define IS_MASTER 1|0).
[env:b1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
build_flags =
    ${env.build_flags}

; Environments dedicated to CI releases (.github/workflows/firmware-release.yml):
; build both roles without touching src/config.h, by overriding the IS_MASTER
; define on the command line (see the #ifndef IS_MASTER in config.h).
; Don't affect [env:b1] above, used for local flashing/dev.
[env:b1_master]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
build_flags =
    ${env.build_flags}
    -D IS_MASTER=1

[env:b1_slave]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
build_flags =
    ${env.build_flags}
    -D IS_MASTER=0

; Host-native unit tests for ServoEngine/MotionEngine's pure trajectory logic
; (easing, clamping, composition, interruption/end policy) — no ESP32 board or
; the Arduino framework involved. See test/native/shim/Arduino.h and
; docs/GESTURE-SEQUENCER-V2.md (Stage 5 exit gate).
[env:native]
platform = native
lib_deps =
extra_scripts =
build_flags =
    -std=gnu++17
    -I test/native/shim
    -I src
build_src_filter =
    -<*>
    +<servo_engine.cpp>
    +<motion_engine.cpp>
test_build_src = yes
test_framework = unity
